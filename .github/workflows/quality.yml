name: MEFRION quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -r requirements.txt
      - run: python scripts/audit_dependencies.py
      - run: python scripts/check_shippable_secrets.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_repository.py
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/mefrion-info
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sites/mefrion-info/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- worker/index.js dist/privacy.html
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_migration_versions.py
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset --local
      - name: Check database access boundaries and tied feed cursors
        run: |
          for test in account_security operator_login_policy security_observability feed_cursor product_analytics apple_metrics; do
            psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f "supabase/tests/$test.sql"
          done
      - if: always()
        run: supabase stop --no-backup
  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Prepare offline simulator configuration (no cloud credentials)
        run: |
          python - <<'PYCONFIG'
          import json
          from pathlib import Path
          path = Path('ios/MEFRION/DevelopmentPublicConfiguration.json')
          assert not path.exists(), 'Do not overwrite an existing development configuration'
          path.write_text(json.dumps({'url': 'https://ci-offline.invalid', 'anon_key': ''}))
          PYCONFIG
      - run: python scripts/verify_ios.py
