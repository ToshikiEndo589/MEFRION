name: MEFRION quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -r requirements.txt
      - run: python scripts/audit_dependencies.py
      - run: python scripts/check_shippable_secrets.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_repository.py
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_migration_versions.py
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset --local
      - name: Check database access boundaries and tied feed cursors
        run: |
          for test in account_security operator_login_policy security_observability feed_cursor; do
            psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f "supabase/tests/$test.sql"
          done
      - if: always()
        run: supabase stop --no-backup
  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/verify_ios.py
